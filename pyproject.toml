[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "package-alert"
version = "0.2.4"
description = "Real-time security monitor for Python, Node.js, and PHP package installations"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Al Slater", email = "al@coralnet.name" },
]
keywords = ["security", "supply-chain", "osv", "malware", "sandbox", "pip", "npm", "composer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "rich>=13",
    "watchdog>=4",
    "psutil>=6",
    "Levenshtein>=0.25",
    "packaging>=23",
]

[project.urls]
Homepage = "https://github.com/alslater/package-alert"
Repository = "https://github.com/alslater/package-alert"

[project.scripts]
package-alert = "packagealert.cli.app:main"
pa = "packagealert.cli.app:main"


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests that exercise real OS resources (filesystem, processes, network)",
]

[tool.hatch.build.targets.wheel]
packages = ["packagealert"]

[tool.hatch.build.targets.sdist]
exclude = ["/.venv", "/.venv-*"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3",
    "pytest-timeout>=2.4.0",
    "respx>=0.21",
    "hatch",
]
