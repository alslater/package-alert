[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "package-alert"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "rich>=13",
    "watchdog>=4",
    "psutil>=6",
    "Levenshtein>=0.25",
]

[project.scripts]
package-alert = "packagealert.cli.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3",
    "respx>=0.21",
    "hatch",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["packagealert"]
