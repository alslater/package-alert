[osv]
cache_ttl_hours = 24
base_url = "https://api.osv.dev/v1"
timeout_seconds = 10.0
max_retries = 3

[watch]
enable_cache_monitoring = true
enable_process_monitoring = true
process_poll_interval_seconds = 1.0
# Cache paths (pip, uv, npm, composer, etc.) are discovered automatically
# from each language module — no manual configuration needed.
# site_packages_dirs = []   # extra site-packages dirs to watch beyond auto-discovered ones

[alerts]
desktop_notifications = true
terminal_notifications = true
min_severity_for_desktop = "MEDIUM"

# Logging for the long-running daemon process.
# Defaults to INFO level with a rotating file at ~/.local/share/package-alert/daemon.log.
[log]
# level = "INFO"              # DEBUG, INFO, WARNING, ERROR, CRITICAL
# file = "~/.local/share/package-alert/daemon.log"
# max_bytes = 10485760        # 10 MB per file before rotation
# backup_count = 3            # number of rotated files to keep

# Logging for short-lived CLI commands (scan-project, query, alerts, etc.).
# Defaults to INFO level with a rotating file at ~/.local/share/package-alert/cli.log.
# Set file = "" to disable file logging for CLI commands.
[cli_log]
# level = "INFO"
# file = "~/.local/share/package-alert/cli.log"
# max_bytes = 10485760
# backup_count = 3

[heuristics]
enabled = true
warning_threshold = 40
critical_threshold = 70
# top_packages_refresh_days = 7   # how often to refresh top-packages lists from each registry (default: 7 days)

# --- Risk score dampening ---
# Heuristic signal scores are multiplied by a combined popularity × age factor,
# reducing false positives for well-established packages.

# Popularity dampening (via deps.dev dependent_count / version_count).
# Packages at or above high_dependent_count receive the minimum popularity_factor.
# high_dependent_count = 1000     # dependents at which popularity factor reaches its floor
# high_version_count = 50         # version count proxy when dependent_count is unavailable
# popularity_floor = 0.25         # minimum popularity multiplier (0.0–1.0)
# popularity_failure_ttl_minutes = 60   # how long to cache a transient deps.dev failure before retrying

# Age dampening (uses publication date from the package registry).
# Packages older than max_damping_age_days receive the minimum age_factor.
# max_damping_age_days = 90       # age at which age factor reaches its floor
# age_floor = 0.25                # minimum age multiplier (0.0–1.0)
# age_failure_ttl_minutes = 60    # how long to cache a transient publication-date fetch failure

# Combined floor applied to popularity_factor × age_factor.
# combined_damping_floor = 0.1    # prevents the combined multiplier from reaching zero

[sandbox]
# extra_env = []      # additional environment variable names to pass into the bubblewrap sandbox
# project_env_allowlist = []  # exact env var names that .pa-run.toml files in repos are
                               # allowed to forward into the sandbox.  Untrusted .pa-run.toml
                               # files (at or below a VCS root) may only forward vars listed
                               # here.  Trusted files (above the VCS root, no world-writable
                               # path components) forward env vars freely.
                               # Example: project_env_allowlist = ["MY_PRIVATE_TOKEN", "REGISTRY_URL"]
# extra_tmpfs = []    # paths to mount as empty tmpfs inside the sandbox, in addition to the
                      # built-in ones (/tmp, $HOME, /etc/ssh/ssh_config.d).  Useful on systems
                      # where other root-owned paths cause SSH or tool failures inside bwrap's
                      # user namespace.  Example:
                      #   extra_tmpfs = ["/etc/ssh/other_config.d"]
# extra_ro_paths = [] # additional paths inside $HOME to re-expose read-only inside the sandbox.
                      # Use this when a tool installed via editable/development install needs its
                      # source directory accessible inside bwrap's home tmpfs.  Example:
                      #   extra_ro_paths = ["/home/user/dev/my-project"]

# editable_roots = [] # directory trees from which pip install -e of *external* sources is permitted.
                      # In-project editable installs (pip install -e .) always work. This setting
                      # only restricts editable installs from source directories outside the project
                      # root. When empty, external editable installs are blocked. System dirs and
                      # credential dirs (~/.ssh, ~/.aws, etc.) are always blocked.  Example:
                      #   editable_roots = ["~/dev", "~/projects"]

[sandbox.cooldown]
# Packages published more recently than period_days are subject to the cooldown policy.
# period_days = 7

# Action when a package is within the cooldown period and has a non-zero
# heuristic risk score (typosquat match, low popularity, etc.).
# One of: "prompt", "warn", "block", "allow"
# on_new_medium_risk = "prompt"

# Action when a package is within the cooldown period and has no risk signals.
# on_new_low_risk = "warn"

# In non-interactive contexts (no TTY — coding agents, CI), escalate "prompt" to this action.
# One of "allow", "warn" or "block": "prompt" is rejected, since escalating prompt to
# prompt would leave the gate asking on a stdin nothing is attached to.
# non_interactive_escalation = "block"

# Risk-score gating for `package-alert run`, independent of the cooldown policy.
# Thresholds are separate from [heuristics] on purpose: at pre-flight nothing is
# installed yet, so only metadata signals (typosquat, low popularity) are
# available and scores top out around 40.
[sandbox.preflight_risk]
# enabled = true

# Score at or above which on_high_risk fires (pre-flight, metadata-only).
# risk_threshold = 25

# Action when the package name looks like a typosquat of a popular package.
# on_typosquat = "prompt"

# Only typosquat matches at or below this edit distance trigger on_typosquat.
# More distant matches are reported as warnings instead. Defaults to the
# detector's own threshold; lower to 1 to gate only on the closest matches.
# typosquat_max_distance = 2

# Minimum typosquat score required to trigger on_typosquat. The raw score is 20
# (distance 1) or 15 (distance 2), reduced when the suspect package has
# established adoption of its own (a trailing version suffix deepens that
# reduction, but never applies on its own — a brand-new "requests2" keeps its
# full score and is gated like any other squat). Gating on the score means those
# reductions suppress false positives: httpx2 (18k dependents) is allowed, while
# reqeusts and requests2 (absent from the registry) are gated.
# typosquat_min_score = 15

# Action when the pre-flight risk score reaches risk_threshold.
# on_high_risk = "warn"

# "prompt" is escalated to this when stdin is not a TTY (CI, coding agents).
# One of "allow", "warn" or "block" — see the cooldown setting above.
# non_interactive_escalation = "block"

# Score at or above which on_post_install_risk fires. Applies after extraction,
# where install-script / eval / embedded-binary signals are also available.
# post_install_threshold = 30

# Action when a newly installed package reaches post_install_threshold.
# One of: "allow" (no-op), "warn" (report only), "prompt" (ask whether to keep the
# packages), "block" (always roll back). Only "block" rolls back unconditionally:
# "prompt" reports and asks, keeping the packages if you accept and rolling back
# via the snapshot restore only if you decline. Declining is the default, so a bare
# Enter rolls back. "prompt" escalates to non_interactive_escalation above when
# stdin is not a TTY, since there is nobody to answer.
# on_post_install_risk = "warn"

[scheduler]
enabled = true
daily_hour = 2     # hour of day (0-23) to run daily scans
weekly_day = 6     # day of week (0=Monday … 6=Sunday) to run weekly scans
weekly_hour = 2    # hour of day (0-23) to run weekly scans
max_scan_history = 5
